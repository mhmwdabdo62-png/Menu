<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>121 Cafe</title>
    <!-- استدعاء خطوط أنيقة -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* خلفية الشاشة بالكامل من صورة اللوجو */
            background-image: url('131680.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tajawal', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* طبقة لونية هادئة (بيج/رمادي شفاف) فوق الخلفية لتوضيح الكلام */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(244, 241, 234, 0.85); /* لون بيج هادئ جداً */
            backdrop-filter: blur(5px);
            z-index: 0;
        }

        /* الحاوية الرئيسية */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 90%;
            max-width: 450px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(138, 130, 124, 0.2);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(74, 54, 35, 0.15);
            animation: slideUpFade 1.2s ease-out forwards;
        }

        /* تصميم نصوص اللوجو */
        .logo-text-container {
            margin-bottom: 35px;
            color: #4a3623;
            animation: float 4s ease-in-out infinite;
        }

        .top-text {
            font-size: 16px;
            letter-spacing: 4px;
            font-weight: 700;
            text-transform: uppercase;
            color: #6d5c50;
            display: block;
            margin-bottom: -10px;
        }

        .main-number {
            font-family: 'Playfair Display', serif;
            font-size: 100px;
            line-height: 1.1;
            font-weight: 700;
            color: #3b2a1a;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .bottom-text {
            font-size: 14px;
            letter-spacing: 3px;
            font-weight: 500;
            color: #6d5c50;
            text-transform: uppercase;
        }

        /* حاوية الأزرار الرئيسية */
        .buttons-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        /* تصميم زر الـ 3D */
        .btn-3d {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            padding: 14px;
            border-radius: 14px;
            transition: all 0.15s ease;
            cursor: pointer;
            border: none;
        }

        /* زر المنيو (بني كلاسيكي) */
        .btn-menu {
            background-color: #5c4332;
            color: #f4f1ea;
            box-shadow: 0 8px 0 #36261c, 0 15px 20px rgba(0,0,0,0.2);
        }

        .btn-menu:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #36261c, 0 5px 10px rgba(0,0,0,0.2);
        }

        /* زر الاتصال الأساسي (رمادي داكن) */
        .btn-call {
            background-color: #8a827c;
            color: #ffffff;
            box-shadow: 0 8px 0 #5c5550, 0 15px 20px rgba(0,0,0,0.2);
        }

        .btn-call:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #5c5550, 0 5px 10px rgba(0,0,0,0.2);
        }

        /* قسم الإدارة (بيتر وبيشوي) */
        .management-section {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(138, 130, 124, 0.3);
            padding-top: 20px;
        }

        .person {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 45%;
        }

        .person-name {
            font-size: 15px;
            font-weight: 700;
            color: #4a3623;
        }

        /* زر 3D صغير لأرقام الإدارة */
        .person-number {
            text-decoration: none;
            background-color: #a89f91;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            padding: 8px 10px;
            border-radius: 10px;
            box-shadow: 0 5px 0 #7a7369;
            transition: all 0.15s ease;
            width: 100%;
            text-align: center;
        }

        .person-number:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #7a7369;
        }

        /* حركات الأنيميشن */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- نصوص اللوجو -->
        <div class="logo-text-container">
            <span class="top-text">ONE TWO ONE</span>
            <div class="main-number">121</div>
            <span class="bottom-text">Speciality Coffee</span>
        </div>

        <!-- الأزرار الرئيسية -->
        <div class="buttons-wrapper">
            <!-- زر المنيو التفاعلي -->
            <a href="https://online.fliphtml5.com/Alshaikh/vwke/#p=1" class="btn-3d btn-menu" target="_blank">
                📖 عرض المنيو
            </a>
            
            <!-- زر الاتصال الأساسي بالكافيه -->
            <a href="tel:01276232463" class="btn-3d btn-call">
                📞 اتصل بنا
            </a>
        </div>

        <!-- أرقام الإدارة -->
        <div class="management-section">
            <!-- اليمين -->
            <div class="person">
                <span class="person-name">بيتر</span>
                <a href="tel:01276047663" class="person-number">01276047663</a>
            </div>
            
            <!-- اليسار -->
            <div class="person">
                <span class="person-name">بيشوي</span>
                <a href="tel:01032558241" class="person-number">01032558241 </a>
            </div>
        </div>
    </div>

</body>
</html>
