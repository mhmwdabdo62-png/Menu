<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>121 Cafe</title>
    <!-- استدعاء خطوط أنيقة -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* خلفية الشاشة بالكامل من صورة اللوجو */
            background-image: url('131680.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tajawal', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* طبقة لونية هادئة (بيج/رمادي شفاف) فوق الخلفية لتوضيح الكلام */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(244, 241, 234, 0.85); /* لون بيج هادئ جداً */
            backdrop-filter: blur(5px);
            z-index: 0;
        }

        /* الحاوية الرئيسية */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 90%;
            max-width: 450px;
            padding: 50px 30px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(138, 130, 124, 0.2); /* إطار رمادي هادئ */
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(74, 54, 35, 0.15);
            animation: slideUpFade 1.2s ease-out forwards;
        }

        /* تصميم نصوص اللوجو */
        .logo-text-container {
            margin-bottom: 40px;
            color: #4a3623; /* بني داكن */
            animation: float 4s ease-in-out infinite;
        }

        .top-text {
            font-size: 16px;
            letter-spacing: 4px;
            font-weight: 700;
            text-transform: uppercase;
            color: #6d5c50; /* بني رمادي */
            display: block;
            margin-bottom: -10px;
        }

        .main-number {
            font-family: 'Playfair Display', serif;
            font-size: 110px;
            line-height: 1.1;
            font-weight: 700;
            color: #3b2a1a;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .bottom-text {
            font-size: 14px;
            letter-spacing: 3px;
            font-weight: 500;
            color: #6d5c50;
            text-transform: uppercase;
        }

        /* حاوية الأزرار */
        .buttons-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* تصميم زر الـ 3D */
        .btn-3d {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
            padding: 16px;
            border-radius: 16px;
            transition: all 0.15s ease;
            cursor: pointer;
            border: none;
            outline: none;
        }

        /* زر المنيو (بني كلاسيكي) */
        .btn-menu {
            background-color: #5c4332;
            color: #f4f1ea;
            /* تأثير الـ 3D عبر الظل السفلي */
            box-shadow: 0 8px 0 #36261c, 0 15px 20px rgba(0,0,0,0.2);
        }

        /* عند الضغط على زر المنيو */
        .btn-menu:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #36261c, 0 5px 10px rgba(0,0,0,0.2);
        }

        /* زر الاتصال (رمادي/بيج داكن) */
        .btn-call {
            background-color: #8a827c;
            color: #ffffff;
            box-shadow: 0 8px 0 #5c5550, 0 15px 20px rgba(0,0,0,0.2);
        }

        /* عند الضغط على زر الاتصال */
        .btn-call:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #5c5550, 0 5px 10px rgba(0,0,0,0.2);
        }

        /* الأيقونات */
        .icon {
            font-size: 24px;
        }

        /* حركات الأنيميشن */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- نصوص اللوجو -->
        <div class="logo-text-container">
            <span class="top-text">ONE TWO ONE</span>
            <div class="main-number">121</div>
            <span class="bottom-text">Speciality Coffee</span>
        </div>

        <!-- الأزرار -->
        <div class="buttons-wrapper">
            <!-- زر المنيو -->
            <a href="https://online.fliphtml5.com/Alshaikh/vwke/#p=1" class="btn-3d btn-menu" target="_blank">
                <span class="icon">📖</span> عرض المنيو
            </a>
            
            <!-- زر الاتصال (قم بتغيير الرقم هنا) -->
            <a href="tel:01000000000" class="btn-3d btn-call">
                <span class="icon">📞</span> اتصل بنا
            </a>
        </div>
    </div>

</body>
</html>
